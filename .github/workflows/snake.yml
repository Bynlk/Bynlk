name: Generate Snake Animation

on:
  schedule:
    # Runs at 12:00 UTC every day
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Bynlk
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=green&color_dots=#bfdadc,#6e8687,#384d50,#1a2f31
            dist/github-contribution-grid-snake.gif?color_snake=green&color_dots=#bfdadc,#6e8687,#384d50,#1a2f31

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
